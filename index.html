<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Backtesting de Exportaciones Peruanas</title>
<link rel="icon" type="image/png" href="./favicon.png">
<style>
  :root{
    --yellow:#f4b731;
    --yellow-soft:#fdf1d2;
    --ink:#171717;
    --gray:#6b7280;
    --line:#e7e7e7;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{
    font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;
    background:#fff;
    color:var(--ink);
    overflow-x:hidden;
    position:relative;
  }
  .stage{
    position:relative;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    overflow:hidden;
  }
  /* esquinas decorativas */
  .deco{position:absolute;pointer-events:none;z-index:0;}
  .deco-tr-ring{top:-90px;right:-90px;width:230px;height:230px;border-radius:50%;border:2px solid var(--ink);}
  .deco-tr-fill{top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:var(--yellow);}
  .deco-bl-fill{bottom:-90px;left:-90px;width:220px;height:220px;border-radius:50%;background:var(--yellow);}
  .deco-bl-ring{bottom:-40px;left:-40px;width:160px;height:160px;border-radius:50%;border:2px solid var(--ink);}
  .dots{position:absolute;bottom:8%;right:6%;display:grid;grid-template-columns:repeat(4,10px);gap:10px;z-index:0;}
  .dots span{width:6px;height:6px;border-radius:50%;background:var(--yellow);}

  .wrap{
    position:relative;z-index:1;
    max-width:1280px;margin:0 auto;
    display:grid;grid-template-columns:1.05fr 0.95fr;
    gap:40px;align-items:center;
    padding:6vh 6vw;width:100%;
  }

  .eyebrow{display:flex;align-items:center;gap:14px;margin-bottom:28px;animation:rise .6s ease-out both;}
  .eyebrow .dash{width:34px;height:3px;background:var(--yellow);border-radius:2px;}
  .eyebrow span{font-size:.78rem;font-weight:700;letter-spacing:.22em;color:var(--ink);}

  h1{
    font-size:clamp(2.1rem,4.4vw,3.2rem);
    line-height:1.14;font-weight:800;margin:0 0 20px;letter-spacing:-0.01em;
    animation:rise .7s ease-out .05s both;
  }
  h1 .accent{color:var(--yellow);}

  .subtitle{
    font-size:1.06rem;line-height:1.6;color:var(--gray);
    max-width:480px;margin:0 0 28px;
    animation:rise .7s ease-out .1s both;
  }

  .divider-label{display:flex;align-items:center;gap:14px;margin-bottom:34px;animation:rise .7s ease-out .15s both;}
  .divider-label .dash{width:34px;height:3px;background:var(--yellow);border-radius:2px;}
  .divider-label span{font-size:.74rem;font-weight:700;letter-spacing:.2em;color:var(--gray);}

  .cta{
    position:relative;display:inline-flex;align-items:center;gap:14px;
    padding:18px 38px;border-radius:999px;border:none;
    background:var(--ink);color:#fff;font-size:.92rem;font-weight:700;letter-spacing:.1em;
    cursor:pointer;text-decoration:none;
    box-shadow:0 12px 26px -12px rgba(0,0,0,.5);
    transition:transform .25s ease,box-shadow .25s ease;
    animation:rise .7s ease-out .2s both, pulse 2.6s ease-in-out 1.2s infinite;
  }
  .cta:hover{transform:translateY(-3px);box-shadow:0 18px 30px -10px rgba(0,0,0,.55);}
  .cta svg{width:17px;height:17px;transition:transform .25s ease;}
  .cta:hover svg{transform:translateX(5px);}
  .cta:active{transform:translateY(-1px) scale(.98);}
  @keyframes pulse{0%,100%{box-shadow:0 12px 26px -12px rgba(0,0,0,.5);}50%{box-shadow:0 14px 30px -8px rgba(244,183,49,.55);}}

  /* columna derecha: mockup */
  .art{position:relative;z-index:1;min-height:420px;display:flex;align-items:center;justify-content:center;}
  .art-blob{position:absolute;width:300px;height:300px;border-radius:50%;background:var(--yellow-soft);left:50%;top:52%;transform:translate(-50%,-50%);z-index:0;}

  .rail{
    position:absolute;left:2%;top:50%;transform:translateY(-50%);
    display:flex;flex-direction:column;gap:14px;z-index:2;
  }
  .rail .icon{
    width:52px;height:52px;border-radius:14px;background:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 22px -12px rgba(0,0,0,.25);
    animation:rise .6s ease-out both;
  }
  .rail .icon:nth-child(1){animation-delay:.15s;}
  .rail .icon:nth-child(2){animation-delay:.25s;}
  .rail .icon:nth-child(3){animation-delay:.35s;}
  .rail .icon:nth-child(4){animation-delay:.45s;}
  .rail .icon svg{width:24px;height:24px;color:var(--ink);}

  .laptop{position:relative;z-index:1;width:min(58%,340px);animation:rise .8s ease-out .2s both;}
  .laptop-screen{
    background:var(--ink);border-radius:16px 16px 4px 4px;padding:10px;
  }
  .laptop-inner{background:#fff;border-radius:8px;padding:16px;min-height:190px;position:relative;}
  .laptop-base{
    height:14px;background:#d8d8d8;border-radius:0 0 10px 10px;
    width:112%;margin-left:-6%;
  }
  .laptop-inner svg{width:100%;height:150px;display:block;}

  .float-card{
    position:absolute;top:-10%;right:-8%;z-index:3;
    background:#fff;border-radius:16px;padding:16px 18px;
    box-shadow:0 18px 34px -16px rgba(0,0,0,.3);
    display:flex;align-items:center;gap:14px;
    animation:rise .7s ease-out .3s both;
  }
  .float-card .globe{width:36px;height:36px;color:var(--ink);flex-shrink:0;}
  .float-card .mini-bars{display:flex;align-items:flex-end;gap:4px;height:26px;}
  .float-card .mini-bars i{width:6px;border-radius:2px;background:var(--line);display:block;}
  .float-card .mini-bars i:last-child{background:var(--yellow);}
  .float-card .lines{display:flex;flex-direction:column;gap:5px;margin-top:6px;}
  .float-card .lines span{width:60px;height:5px;border-radius:3px;background:var(--line);display:block;}

  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){ *{animation:none !important;} .cta:hover{transform:none;} }

  @media (max-width:900px){
    .wrap{grid-template-columns:1fr;text-align:center;}
    .eyebrow,.divider-label{justify-content:center;}
    .subtitle{margin-left:auto;margin-right:auto;}
    .art{margin-top:40px;min-height:340px;}
    .rail{left:-4%;}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="deco deco-tr-ring"></div>
  <div class="deco deco-tr-fill"></div>
  <div class="deco deco-bl-fill"></div>
  <div class="deco deco-bl-ring"></div>
  <div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>

  <div class="wrap">
    <div class="left">
      <div class="eyebrow"><span class="dash"></span><span>TESIS DE INVESTIGACIÓN</span></div>

      <h1>Backtestin de<br><span class="accent">Exportaciones</span> Peruanas</h1>

      <p class="subtitle">Aplicación de modelos de Machine Learning y Deep Learning para la predicción de exportaciones</p>

      <div class="divider-label"><span class="dash"></span><span>PRESENTACIÓN INTERACTIVA DE RESULTADOS</span></div>

      <a class="cta" href="modelos.html">
        INGRESAR
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </div>

    <div class="art">
      <div class="art-blob"></div>

      <div class="rail">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3a3 3 0 0 0-3 3v1a3 3 0 0 0-1 5.6A3 3 0 0 0 8 17a3 3 0 0 0 5-2.24V6a3 3 0 0 0-3-3Z"></path>
            <path d="M14.5 4.5A3 3 0 0 1 20 6.4 3 3 0 0 1 19 12a3 3 0 0 1-3 5 3 3 0 0 1-3-2"></path>
          </svg>
        </div>
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="6" r="2.4"></circle><circle cx="18" cy="6" r="2.4"></circle><circle cx="12" cy="17" r="2.4"></circle>
            <path d="M8 7l3 8M16 7l-3 8"></path>
          </svg>
        </div>
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <ellipse cx="12" cy="6" rx="8" ry="3"></ellipse>
            <path d="M4 6v6c0 1.66 3.58 3 8 3s8-1.34 8-3V6"></path>
            <path d="M4 12v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"></path>
          </svg>
        </div>
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="20" x2="5" y2="12"></line>
            <line x1="12" y1="20" x2="12" y2="7"></line>
            <line x1="19" y1="20" x2="19" y2="14"></line>
          </svg>
        </div>
      </div>

      <div class="laptop">
        <div class="float-card">
          <svg class="globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"></circle><line x1="3" y1="12" x2="21" y2="12"></line><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"></path></svg>
          <div class="mini-bars"><i style="height:40%"></i><i style="height:65%"></i><i style="height:50%"></i><i style="height:90%"></i></div>
        </div>
        <div class="laptop-screen">
          <div class="laptop-inner">
            <svg viewBox="0 0 240 150" preserveAspectRatio="none">
              <polyline points="10,120 45,95 80,105 115,60 150,75 185,40 220,25" fill="none" stroke="#171717" stroke-width="3"/>
              <circle cx="10" cy="120" r="4" fill="#171717"/><circle cx="45" cy="95" r="4" fill="#171717"/>
              <circle cx="80" cy="105" r="4" fill="#171717"/><circle cx="115" cy="60" r="4" fill="#171717"/>
              <circle cx="150" cy="75" r="4" fill="#171717"/><circle cx="185" cy="40" r="4" fill="#171717"/>
              <circle cx="220" cy="25" r="4" fill="#f4b731"/>
              <rect x="140" y="110" width="16" height="30" fill="#f4b731"/>
              <rect x="165" y="90" width="16" height="50" fill="#f4b731"/>
              <rect x="190" y="65" width="16" height="75" fill="#f4b731"/>
              <rect x="215" y="45" width="16" height="95" fill="#f4b731"/>
            </svg>
          </div>
          <div class="laptop-base"></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
